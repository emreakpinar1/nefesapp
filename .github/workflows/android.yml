name: Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.FERAH_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "Android SDK hazır: $ANDROID_HOME"

      - name: Android projesini hazırla
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node prepare.mjs

      - name: Deneme APK'sı (imzasız)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Ferah.apk"

      - name: Mağaza paketi (imzalı AAB + APK)
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.FERAH_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FERAH_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=$KS_PASS"
          ./gradlew bundleRelease assembleRelease $SIGN --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Ferah-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Ferah.apk"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: AAB'yi sakla (Play Console'a yüklenecek dosya)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ferah-playstore-aab
          path: Ferah-*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Ferah-apk
          path: Ferah.apk

      - name: Releases'a koy (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Ferah.apk \
            --prerelease \
            --title "Ferah Android (son sürüm $VERSION_NAME)" \
            --notes "Otomatik derleme · ${GITHUB_SHA::7} · sürüm $VERSION_NAME. Android telefona yüklemek için Ferah.apk dosyasını indir."
